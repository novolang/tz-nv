[package]
name        = "tz-nv"
version     = "0.1.0"
description = "The IANA time zone database as data a program can hold: zone lookup by name, the offset and abbreviation at an instant, UTC to local and back over calendar-nv's civil types with the gap and the overlap as an enum the caller must match, the POSIX TZ footer rule for dates past the table, and a TZif reader so a host may load the system's own zone files instead of the bundled pack."
license     = "Apache-2.0"

# `experimental` because no program outside this repository has used the
# package yet, and the tests were written against the signatures rather
# than by a consumer.
stability   = "experimental"

# `core`.  The tzdata rules are data, and a lookup in them is a search
# over integers: nothing is read, nothing is written, and there is no
# clock anywhere in the package.  Two places a reader expects an effect
# and does not find one:
#
#   * the bundled packs are text the package owns, not files it opens,
#     so `data_full()` declares no effect;
#   * `tzif` parses the bytes of a file such as
#     `/usr/share/zoneinfo/Europe/Berlin` and never reads them.  The
#     `[fs]` is the caller's, so the same reader serves a host, a
#     firmware image with the file in flash, and a test with the bytes
#     written in line.
#
# It carries `tests/embedded_probe.nv`, which builds `tzrule` for a
# Cortex-M4 and checks eleven answers on it under QEMU, and
# `tests/alloc_scan.sh`, which finds no call to the allocator in the
# fourteen functions of `tzrule`.  A POSIX TZ rule is forty bytes and its
# arithmetic is integers, which is what a battery clock with an RTC and
# no filesystem runs.
layer       = "core"

category    = "time"

tags        = ["timezone", "tzdata", "iana", "zoneinfo", "tzif", "dst", "chrono-tz", "posix-tz"]
repository  = "https://github.com/novolang/tz-nv"
maintainers = ["novo-lang"]
# Lists and `Bytes` as reference types, `if let` and negative indexing
# are all in 0.13.0.
novo        = ">= 0.13.0"

# A library: no `main`, so `novo pkg build` type-checks and
# effect-checks every module under `src/` and writes no binary.

[docs.pages]
"README.md" = "The zone rules as data, and the two answers a local time can have"

[dependencies]
# calendar-nv, and only calendar-nv.
#
# The conversion this package exists for has a civil date-time on one
# side of it.  A package that declared its own would declare a second
# `CivilDateTime` that no calendar-nv function accepts, and
# `tzlocal.resolve` would not compose with calendar-nv's `arith`.
# calendar-nv is `core`, the same layer as this package.
calendar-nv = "^0.2.0"
